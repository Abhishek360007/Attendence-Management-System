spring.application.name=attendance-management-system
# Render injects PORT; SERVER_PORT is for local runs.
server.port=${PORT:${SERVER_PORT:9010}}
server.shutdown=graceful
# Render terminates HTTPS in front of the app; trust its X-Forwarded-* headers so cookies are marked secure.
server.forward-headers-strategy=framework

# ---- Database (PostgreSQL, e.g. Neon) ----
# Neon: jdbc:postgresql://<host>.neon.tech/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Neon suspends compute after a few idle minutes. Let idle connections close (min-idle 0, no keepalive)
# so the pool never keeps the database awake; connections are reopened on demand.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# Tables are created and upgraded by Flyway (src/main/resources/db/migration).
# baseline-on-migrate lets it take over databases created before migrations existed; V1 is written to be re-runnable.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# ---- Sign-in ----
spring.session.jdbc.initialize-schema=never
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
# Machine access: requests with header "X-API-Key: <value>" are allowed read access (and to trigger a sync).
# The same key is needed once to create the first admin account on the setup screen.
attendance.api-key=${API_KEY:}
# Optional: create this admin account on startup if there are no users yet.
attendance.bootstrap-admin.email=${ADMIN_EMAIL:}
attendance.bootstrap-admin.password=${ADMIN_PASSWORD:}

# ---- ZKTeco source database (MS Access .mdb file written by ZKTime / ZKAccess) ----
attendance.device.mdb-path=${ZKTECO_MDB_PATH:C:/ZKTeco/ATT2000.MDB}

# ---- Sync job ----
# Turn this off on cloud instances that cannot see the .mdb file.
attendance.sync.enabled=${SYNC_ENABLED:true}
# Spring cron: second minute hour day month weekday
attendance.sync.cron=${SYNC_CRON:0 */1 * * * *}
# Maximum rows read from the device database per run
attendance.sync.batch-size=${SYNC_BATCH_SIZE:5000}
# Databases without CHECKINOUT.Auto_increment: days re-read each run to pick up punches downloaded late
attendance.sync.lookback-days=${SYNC_LOOKBACK_DAYS:7}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# A missing yes/no or number field in a request means false/0 (Jackson 3 would otherwise reject it).
spring.jackson.deserialization.fail-on-null-for-primitives=false

# ---- Notifications ----
# Daily absence/late alerts, irregularities and weekly/monthly reports (see NotificationJobs). Safe to leave on in
# several instances: each job runs once per period.
attendance.notifications.enabled=${NOTIFICATIONS_ENABLED:true}
# Dashboard address used in email links, e.g. https://attendance-management-system-5pid.onrender.com
attendance.public-url=${PUBLIC_URL:}

# ---- Email (optional; without it notifications only appear in the dashboard) ----
# Gmail example: MAIL_HOST=smtp.gmail.com MAIL_PORT=587 MAIL_USERNAME=you@gmail.com MAIL_PASSWORD=<app password>
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=15000
spring.mail.properties.mail.smtp.writetimeout=15000
attendance.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# An unreachable or unset mail server must not mark the application as down.
management.health.mail.enabled=false
