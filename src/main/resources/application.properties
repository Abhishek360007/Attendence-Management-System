spring.application.name=attendance-management-system
# Render injects PORT; SERVER_PORT is for local runs.
server.port=${PORT:${SERVER_PORT:9010}}
server.shutdown=graceful

# ---- Database (PostgreSQL, e.g. Neon) ----
# Neon: jdbc:postgresql://<host>.neon.tech/<db>?sslmode=require
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/attendance}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# Neon suspends compute after a few idle minutes. Let idle connections close (min-idle 0, no keepalive)
# so the pool never keeps the database awake; connections are reopened on demand.
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:0}
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000

# Create tables on startup if they do not exist (see schema.sql)
spring.sql.init.mode=${SCHEMA_INIT:always}

# ---- API security ----
# When set, every /api/** request must send header "X-API-Key: <value>".
attendance.api-key=${API_KEY:}

# ---- ZKTeco source database (MS Access .mdb file written by ZKTime / ZKAccess) ----
attendance.device.mdb-path=${ZKTECO_MDB_PATH:C:/ZKTeco/ATT2000.MDB}

# ---- Sync job ----
# Turn this off on cloud instances that cannot see the .mdb file.
attendance.sync.enabled=${SYNC_ENABLED:true}
# Spring cron: second minute hour day month weekday
attendance.sync.cron=${SYNC_CRON:0 */1 * * * *}
# Maximum rows read from the device database per run
attendance.sync.batch-size=${SYNC_BATCH_SIZE:5000}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
