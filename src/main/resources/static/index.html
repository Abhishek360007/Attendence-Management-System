<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attendance Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><path d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --border: #e3e6ea; --text: #16181d; --muted: #646b76;
    --accent: #2563eb; --accent-text: #ffffff; --ok: #15803d; --ok-bg: #e8f5ec; --bad: #b42318; --bad-bg: #fdecea;
    --row-hover: #f3f5f8; --shadow: 0 1px 2px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a20; --border: #2a2f38; --text: #e8eaee; --muted: #9aa2ae;
      --accent: #4f8cff; --accent-text: #0b1020; --ok: #4ade80; --ok-bg: #12261a; --bad: #f87171; --bad-bg: #2a1414;
      --row-hover: #1e222a; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 0 16px; }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; font-size: 16px; }
  .logo { width: 28px; height: 28px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
  main.wrap { padding-top: 24px; padding-bottom: 48px; }
  h2 { font-size: 15px; margin: 0 0 12px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { padding: 16px; }
  .stat .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .stat .value { font-size: 24px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .stat .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 12px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .card { min-width: 0; }
  .tab { background: none; border: 0; padding: 12px 10px; color: var(--muted); font: inherit; cursor: pointer;
         border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; padding: 14px 12px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
          border-radius: 7px; padding: 7px 10px; min-width: 0; }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button.btn { font: inherit; border-radius: 7px; padding: 7px 14px; cursor: pointer; border: 1px solid var(--border);
               background: var(--surface); color: var(--text); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button.btn:disabled { opacity: .55; cursor: default; }
  .table-wrap { overflow-x: auto; border-top: 1px solid var(--border); }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--surface); }
  tbody tr:hover { background: var(--row-hover); }
  td.num, th.num { text-align: right; }
  .empty { padding: 36px 16px; text-align: center; color: var(--muted); }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.bad { color: var(--bad); background: var(--bad-bg); }
  .muted { color: var(--muted); }
  .error { margin: 0 12px 12px; padding: 10px 12px; border-radius: 7px; color: var(--bad); background: var(--bad-bg); }
  .login { max-width: 420px; margin: 64px auto; padding: 24px; }
  .login p { color: var(--muted); margin: 4px 0 16px; }
  .login form { display: flex; flex-direction: column; gap: 12px; }
  .hidden { display: none !important; }
  .pager { display: flex; gap: 8px; justify-content: flex-end; align-items: center; padding: 10px 12px; color: var(--muted); }
  @media (max-width: 560px) { .filters > * { flex: 1 1 140px; } .bar .muted { display: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="brand">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 32 32"><path d="M8 16.5l5 5L24 10.5" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      Attendance Dashboard
    </div>
    <div>
      <span class="muted" id="who"></span>
      <button class="btn hidden" id="logout" type="button">Sign out</button>
    </div>
  </div>
</header>

<section class="card login hidden" id="login">
  <h2>Enter API key</h2>
  <p>Find it in Render → your service → Environment → <code>API_KEY</code>. It is saved in this browser only.</p>
  <form id="loginForm">
    <input id="keyInput" type="password" placeholder="API key" autocomplete="current-password" required>
    <button class="btn primary" type="submit">Continue</button>
    <div class="error hidden" id="loginError" style="margin:0"></div>
  </form>
</section>

<main class="wrap hidden" id="app">
  <div class="stats">
    <div class="card stat"><div class="label">Total punches</div><div class="value" id="sTotal">–</div><div class="sub">stored in database</div></div>
    <div class="card stat"><div class="label">Last device record</div><div class="value" id="sLast">–</div><div class="sub">highest synced ZKTeco id</div></div>
    <div class="card stat"><div class="label">Last sync</div><div class="value" id="sRun" style="font-size:18px">–</div><div class="sub" id="sRunSub">&nbsp;</div></div>
  </div>

  <div class="card">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="summary" aria-selected="true">Daily summary</button>
      <button class="tab" role="tab" data-tab="punches" aria-selected="false">Punches</button>
      <button class="tab" role="tab" data-tab="history" aria-selected="false">Sync history</button>
    </div>

    <form class="filters" id="filters">
      <label class="f">From <input type="date" id="from"></label>
      <label class="f">To <input type="date" id="to"></label>
      <label class="f">Employee ID <input type="text" id="emp" placeholder="All employees" size="14"></label>
      <button class="btn primary" type="submit">Apply</button>
      <button class="btn" type="button" id="csv">Export CSV</button>
    </form>

    <div class="error hidden" id="error"></div>
    <div class="table-wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
    <div class="empty hidden" id="empty"></div>
    <div class="pager hidden" id="pager">
      <span id="pageInfo"></span>
      <button class="btn" type="button" id="prev">Previous</button>
      <button class="btn" type="button" id="next">Next</button>
    </div>
  </div>
</main>

<script>
(() => {
  const KEY_STORE = "ams.apiKey";
  const PAGE_SIZE = 100;
  const $ = (id) => document.getElementById(id);
  const store = {
    get() { try { return localStorage.getItem(KEY_STORE) || ""; } catch { return ""; } },
    set(v) { try { localStorage.setItem(KEY_STORE, v); } catch {} },
    clear() { try { localStorage.removeItem(KEY_STORE); } catch {} }
  };

  let apiKey = store.get();
  let tab = "summary";
  let page = 0;
  let rows = [];

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const today = () => new Date().toLocaleDateString("en-CA");
  const fmtTime = (iso) => iso ? iso.slice(11, 16) : "–";
  const fmtDateTime = (iso) => iso ? iso.replace("T", " ").slice(0, 16) : "–";
  const fmtMinutes = (m) => m ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : "–";
  const checkType = (t) => ({ I: "In", O: "Out", "0": "In", "1": "Out" }[t] || t || "–");

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { "X-API-Key": apiKey, ...(opts.headers || {}) } });
    if (res.status === 401) { const e = new Error("Invalid API key"); e.auth = true; throw e; }
    const body = await res.json().catch(() => null);
    if (!res.ok) throw new Error(body?.detail || `Request failed (${res.status})`);
    return body;
  }

  function showLogin(message) {
    $("app").classList.add("hidden");
    $("logout").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginError").textContent = message || "";
    $("loginError").classList.toggle("hidden", !message);
    $("keyInput").focus();
  }

  async function start() {
    try {
      await loadStatus();
    } catch (e) {
      if (e.auth) { store.clear(); apiKey = ""; return showLogin("That API key was not accepted."); }
      $("error").textContent = e.message; $("error").classList.remove("hidden");
    }
    $("login").classList.add("hidden");
    $("app").classList.remove("hidden");
    $("logout").classList.remove("hidden");
    load();
  }

  async function loadStatus() {
    const s = await api("/api/sync/status");
    $("sTotal").textContent = s.totalRecords.toLocaleString();
    $("sLast").textContent = s.lastSourceId.toLocaleString();
    if (s.lastRun) {
      const ok = s.lastRun.status === "SUCCESS";
      $("sRun").innerHTML = `<span class="pill ${ok ? "ok" : "bad"}">${esc(s.lastRun.status)}</span>`;
      $("sRunSub").textContent = fmtDateTime(s.lastRun.finishedAt || s.lastRun.startedAt);
    } else {
      $("sRun").textContent = "Never";
      $("sRunSub").textContent = "waiting for the sync agent";
    }
  }

  const columns = {
    summary: [
      ["Date", (r) => esc(r.date)],
      ["Employee", (r) => esc(r.employeeId)],
      ["Name", (r) => esc(r.employeeName || "–")],
      ["First in", (r) => fmtTime(r.firstIn)],
      ["Last out", (r) => fmtTime(r.lastOut)],
      ["Punches", (r) => r.punches, "num"],
      ["Worked", (r) => fmtMinutes(r.workedMinutes), "num"]
    ],
    punches: [
      ["Time", (r) => fmtDateTime(r.checkTime)],
      ["Employee", (r) => esc(r.employeeId)],
      ["Name", (r) => esc(r.employeeName || "–")],
      ["Type", (r) => esc(checkType(r.checkType))],
      ["Device", (r) => esc(r.deviceId ?? "–"), "num"],
      ["Record #", (r) => r.sourceId, "num"]
    ],
    history: [
      ["Started", (r) => fmtDateTime(r.startedAt)],
      ["Status", (r) => `<span class="pill ${r.status === "SUCCESS" ? "ok" : "bad"}">${esc(r.status)}</span>`],
      ["Records", (r) => r.recordsSynced, "num"],
      ["Up to record #", (r) => r.lastSourceId, "num"],
      ["Message", (r) => `<span class="muted">${esc(r.message || "")}</span>`]
    ]
  };

  async function load() {
    $("error").classList.add("hidden");
    $("filters").classList.toggle("hidden", tab === "history");
    const from = $("from").value, to = $("to").value, emp = $("emp").value.trim();
    const q = new URLSearchParams({ from, to });
    if (emp) q.set("employeeId", emp);
    try {
      if (tab === "summary") rows = await api(`/api/attendance/summary?${q}`);
      else if (tab === "punches") { q.set("page", page); q.set("size", PAGE_SIZE); rows = await api(`/api/attendance?${q}`); }
      else rows = await api("/api/sync/history?limit=50");
    } catch (e) {
      if (e.auth) { store.clear(); return showLogin("Your API key is no longer valid."); }
      rows = [];
      $("error").textContent = e.message; $("error").classList.remove("hidden");
    }
    render();
  }

  function render() {
    const cols = columns[tab];
    $("thead").innerHTML = `<tr>${cols.map(([h, , c]) => `<th class="${c || ""}">${h}</th>`).join("")}</tr>`;
    $("tbody").innerHTML = rows.map((r) => `<tr>${cols.map(([, f, c]) => `<td class="${c || ""}">${f(r)}</td>`).join("")}</tr>`).join("");
    const empty = rows.length === 0;
    $("empty").classList.toggle("hidden", !empty);
    $("empty").innerHTML = tab === "history"
      ? "No sync runs yet. Runs appear here once the sync agent on the ZKTeco PC copies or fails to copy punches."
      : "No attendance for this period.<br><span style='font-size:12px'>Data arrives once the sync agent runs on the PC with the ZKTeco software.</span>";
    const paged = tab === "punches" && (page > 0 || rows.length === PAGE_SIZE);
    $("pager").classList.toggle("hidden", !paged);
    $("pageInfo").textContent = `Page ${page + 1}`;
    $("prev").disabled = page === 0;
    $("next").disabled = rows.length < PAGE_SIZE;
    $("csv").disabled = empty;
  }

  function exportCsv() {
    const cols = columns[tab];
    const strip = (html) => { const d = document.createElement("div"); d.innerHTML = html; return d.textContent; };
    const cell = (v) => `"${String(v).replace(/"/g, '""')}"`;
    const lines = [cols.map(([h]) => cell(h)).join(",")]
      .concat(rows.map((r) => cols.map(([, f]) => cell(strip(String(f(r))))).join(",")));
    const blob = new Blob([lines.join("\r\n")], { type: "text/csv" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `attendance-${tab}-${$("from").value}_to_${$("to").value}.csv`;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  $("from").value = $("to").value = today();
  document.querySelectorAll(".tab").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach((x) => x.setAttribute("aria-selected", String(x === b)));
    tab = b.dataset.tab; page = 0; load();
  }));
  $("filters").addEventListener("submit", (e) => { e.preventDefault(); page = 0; load(); loadStatus().catch(() => {}); });
  $("prev").addEventListener("click", () => { page = Math.max(0, page - 1); load(); });
  $("next").addEventListener("click", () => { page++; load(); });
  $("csv").addEventListener("click", exportCsv);
  $("logout").addEventListener("click", () => { store.clear(); apiKey = ""; showLogin(); });
  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    apiKey = $("keyInput").value.trim();
    store.set(apiKey);
    $("keyInput").value = "";
    start();
  });

  apiKey ? start() : showLogin();
})();
</script>
</body>
</html>
